name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: opspilot_ci
          POSTGRES_DB: opspilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opspilot -d opspilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://opspilot:opspilot_ci@localhost:5432/opspilot?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @opspilot/api exec prisma validate
      - run: pnpm --filter @opspilot/api exec prisma migrate deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm --filter @opspilot/api test:e2e
      - name: Commit generated dependency lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/foundation'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f pnpm-lock.yaml ] && ! git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add pnpm-lock.yaml
            git commit -m 'chore(deps): commit generated pnpm lockfile'
            # PR workflows check out a synthetic merge commit. Rebase the generated
            # lockfile commit onto the current PR head before pushing.
            git fetch origin "${{ github.head_ref }}"
            git checkout -B "${{ github.head_ref }}" "origin/${{ github.head_ref }}"
            git show HEAD@{1}:pnpm-lock.yaml > pnpm-lock.yaml
            if [ ! -f pnpm-lock.yaml ]; then
              echo 'Generated lockfile unavailable after branch checkout' >&2
              exit 1
            fi
            git add pnpm-lock.yaml
            git commit -m 'chore(deps): commit generated pnpm lockfile'
            git push origin "HEAD:${{ github.head_ref }}"
          fi
